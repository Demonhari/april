[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmw"
version = "0.1.0"
description = "Open-source middleware for AI agents: monitor mid-run, compress context, reuse reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "agentmw contributors" }]
keywords = ["llm", "agents", "anthropic", "openai", "mcp", "middleware"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
semantic = ["fastembed>=0.4"]
mcp = ["mcp>=1.0"]
all = ["anthropic>=0.40", "fastembed>=0.4", "mcp>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
agentmw = "agentmw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmw"]
