[project]
name = "praxos"
version = "0.1.0"
description = "Experience OS for AI employees"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Praxos Team" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp-use>=1.5.1",
]

[project.scripts]
praxos = "praxos.cli:main"
praxos-server = "praxos.server:main"
praxos-mcp = "praxos.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxos"]
