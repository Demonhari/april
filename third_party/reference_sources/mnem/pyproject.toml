[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnem"
version = "0.3.0"
description = "Memory as state, not search — a deterministic, dependency-free memory for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["memory", "agents", "llm", "rag", "state", "belief-revision"]
authors = [{ name = "mnem authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/JustVugg/mnem"
Source = "https://github.com/JustVugg/mnem"

[tool.setuptools]
packages = ["mnem"]
