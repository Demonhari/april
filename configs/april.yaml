api:
  host: 127.0.0.1
  port: 8765
  token: local-dev-token
  cors_enabled: false
  max_request_bytes: 1048576

runtime:
  host: 127.0.0.1
  port: 8766
  url: http://127.0.0.1:8766
  token: local-dev-runtime-token
  backend: llama_cpp
  preload_keep_loaded: true
  request_timeout_seconds: 120
  max_loaded_specialist_models: 2

memory:
  database_path: data/april.db
  vector_index_path: data/vector_index
  # hashed-token is the dev/first-run fallback: deterministic, offline, and
  # needing no model files (fake-backend tests keep working). runtime-local is
  # the NORMAL PRODUCTION PATH once a local embedding-role GGUF is registered
  # in configs/models.yaml: set embedding_provider: runtime-local (or
  # APRIL_MEMORY_EMBEDDING_PROVIDER) and run `run april memory reindex`.
  # If runtime-local is requested but the model is unavailable, APRIL keeps an
  # audited fallback to hashed-token and flags it in `run april memory doctor`.
  embedding_provider: hashed-token
  embedding_model_id: null

paths:
  logs_path: logs
  audit_path: logs/audit.jsonl
  allowed_filesystem_roots:
    - .
  max_file_read_bytes: 1048576
  max_file_write_bytes: 1048576

permissions:
  approval_expiry_seconds: 900
  maximum_agent_tool_iterations: 5
  external_actions_enabled: false
  tool_timeout_seconds: 15

brain:
  model_id: april-brain
  # Null aliases routing to the Brain without a duplicate registry entry or
  # a second load of the same GGUF.
  router_model_id: null
  routing_reliability_min_samples: 5
  routing_reliability_prior_successes: 4.0
  routing_reliability_prior_failures: 4.0

# Core-side character pre-bounds for independent context categories. Runtime's
# tokenizer and model context window remain the final exact budget authority.
conversation_context:
  summary_enabled: true
  recent_turns_preserved: 4
  older_turns_before_summary: 3
  max_turns_per_summary: 8
  summary_max_output_tokens: 512
  summary_timeout_seconds: 30
  rendered_summary_max_chars: 4000
  conversation_history_max_chars: 8000
  durable_memory_max_chars: 4000
  file_document_max_chars: 6000
  tool_output_max_chars: 3000

# Voice is OFF by default and entirely local. It stays opt-in: enabling it needs
# the optional `.[voice]` extra plus whisper.cpp / Piper binaries and models you
# provide, then `run april setup voice`. While disabled, missing voice artifacts
# are skipped by readiness/target-Mac verification, never treated as blockers.
voice:
  enabled: false
  audio_cache_path: data/audio_cache
  retain_debug_audio: false
  # Calibrated energy confirms onset independently from sustained endpoint
  # silence. The deprecated vad_required_frames key remains accepted as an
  # onset alias, but does not control end-of-speech timing.
  vad_energy_threshold: 0.01
  vad_onset_frames: 3
  endpoint_silence_ms: 650
  minimum_utterance_ms: 300
  noise_calibration_ms: 300
  noise_threshold_multiplier: 2.5
  noise_threshold_margin: 0.002
  vad_hangover_ms: 100
  utterance_max_seconds: 15.0
  # wake_word is safest without acoustic echo cancellation. "speech" is an
  # explicit energy-based opt-in; action controls stop versus duck separately.
  barge_in_trigger: wake_word
  barge_in_action: stop
  barge_in_speech_onset_frames: 6
  barge_in_playback_grace_ms: 400
  whisper_binary_path: null
  whisper_model_path: null
  # Optional two-stage overrides. Null inherits the two legacy paths above.
  wake_confirmation_whisper_binary_path: null
  wake_confirmation_whisper_model_path: null
  transcription_whisper_binary_path: null
  transcription_whisper_model_path: null
  piper_binary_path: null
  piper_model_path: null
  wake_word_model_path: null
  # v2: the Sentinel can watch several wake models at once. The singular
  # wake_word_model_path above stays supported; entries here are additive.
  wake_word_model_paths: []

# Always-on wake (Sentinel). OFF by default. Two-stage detection: an
# openWakeWord score >= candidate_threshold makes a candidate; >= accept_threshold
# accepts outright, otherwise local STT confirms from the ring buffer. The
# Sentinel is the only process that opens the microphone.
wake:
  enabled: false
  candidate_threshold: 0.35
  accept_threshold: 0.70
  confirm_with_stt: true
  # With STT confirmation enabled, true lets scores >= accept_threshold wake
  # immediately; false sends every candidate through local STT confirmation.
  instant_accept: true
  ring_buffer_seconds: 10
  follow_up_seconds: 8
  earcon_enabled: true
  strict_address: false
  # Convenience filter only, never authentication. "soft" requires an
  # operator-provided local raw-waveform speaker-embedding ONNX; absent or
  # unloadable, Sentinel audits one warning and safely behaves as "off".
  speaker_gate: "off"
  # Model binaries are operator-supplied and never downloaded by APRIL. See
  # scripts/speaker_verifier/README.md for the required ONNX input contract.
  speaker_verifier_model_path: null

# Cross-surface session continuity: a wake (voice/terminal/desktop/hotkey/socket)
# within continuity_minutes of the last activity joins the existing conversation.
session:
  continuity_minutes: 10

# apriald supervisor (installed as a user LaunchAgent; never sudo).
daemon:
  autostart_on_cli: true
  startup_timeout_seconds: 15.0
  shutdown_timeout_seconds: 5.0
  health_poll_seconds: 0.2
  child_startup_grace_seconds: 10.0
  child_health_failure_threshold: 3
  child_crash_loop_threshold: 5

# Resource Governor budgets. Consulted by Sentinel/Dreamer/model prewarm.
governor:
  max_resident_gb: 12
  dreamer_nice: 10
  # llama.cpp fixes n_threads when a model instance is loaded. The governor's
  # typed request hint therefore takes effect on the next safe model load/reload.
  generation_threads_active: 6
  generation_threads_idle: 8

# Nightly Dreamer self-evolution. OFF by default. All writes are fenced to
# data/evolution/, data/playbooks/, and explicitly allowed DB tables; deleting
# data/evolution restores stock behaviour.
evolution:
  enabled: false
  window: "02:30-06:00"
  require_ac_power: true
  max_minutes: 90
  # Reassess background-work policy between D1-D5 work phases. A busy machine
  # pauses remaining work but D6 still writes an honest report.
  recheck_governor_between_phases: true
  daily_memory_cap: 30
  prompt_overlay_max_chars: 1200
  model_drafted_overlays: false
  user_model_autoapply: safe_sections_only

# Budgets for /chat deep and council modes (intelligence ladder R3/R4).
deep_mode:
  max_seconds: 45
  council_n: 3
  council_mode: reasoning_n
  deep_confidence_threshold: 0.4
  verified_confidence_threshold: 0.7
  verified_draft_tokens: 1024
  verified_critique_tokens: 512
  verified_revision_tokens: 1024
  deep_tokens: 1536
  council_candidate_tokens: 1024
  council_judge_tokens: 512

# Proactive scheduler. OFF by default: with these safe defaults APRIL never fires
# reminders or daily briefings on its own. The background loop only starts when
# enabled is true, and briefings only fire when briefing_enabled is true.
scheduler:
  # Master switch for the background poll loop that fires due reminders.
  enabled: false
  # How often the loop wakes to check for due reminders / briefing time (seconds).
  poll_interval_seconds: 30
  # Where notifications go: "log" (audit + logs/scheduler.log) or "macos" (native banner).
  notification_sink: log
  # Daily briefing switch. Independent of `enabled`; the briefing path is gated by this.
  briefing_enabled: false
  # Local time of day (HH:MM, 24h) to fire the daily briefing, once per local day.
  briefing_time: "08:00"
  # Read-only repo monitoring surfaced inside the daily briefing. OFF by default.
  # When true, the briefing lists registered projects with new commits or
  # uncommitted changes since the last briefing. Never accesses the network.
  repo_monitor_enabled: false
